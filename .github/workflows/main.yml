name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK commandline tools
        run: |
          set -eux
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$HOME"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-temp
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools-temp/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          rm -rf cmdline-tools.zip cmdline-tools-temp
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-31" "build-tools;31.0.0"

      - name: Download project
        run: |
          set -eux
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          cd "$HOME"
          wget -O project.zip "https://github.com/AshwinSoni-01/FrostKeys/archive/refs/tags/v2.5.7.zip"
          unzip -q project.zip
          if [ -d "FrostKeys-2.5.7" ]; then
            cd FrostKeys-2.5.7
          else
            echo "Expected FrostKeys-2.5.7 directory not found"
            exit 1
          fi

          if [ -f "Frostkeys-main.zip" ]; then
            unzip -q Frostkeys-main.zip -d .
            if [ -d "Frostkeys-main" ]; then
              mv Frostkeys-main frostkeys
              cd frostkeys
            fi
          else
            cd ..
            mv FrostKeys-2.5.7 frostkeys
            cd frostkeys
          fi

          chmod +x gradlew

      - name: Build APK
        run: |
          set -eux
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          cd "$HOME/frostkeys"
          ./gradlew assembleDebug --no-daemon -Porg.gradle.jvmargs="-Xmx2048m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: $HOME/frostkeys/app/build/outputs/apk/debug/*.apk

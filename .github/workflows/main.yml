name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Download project
  run: |
    cd ~
    wget -O project.zip "https://github.com/AshwinSoni-01/FrostKeys/archive/refs/tags/v2.5.7.zip"
    unzip project.zip
    cd FrostKeys-2.5.7
    if [ -f Frostkeys-main.zip ]; then
      unzip Frostkeys-main.zip
      mv Frostkeys-main frostkeys
    else
      echo "Warning: Frostkeys-main.zip not found, using current directory"
      mv . frostkeys
    fi
    cd frostkeys
    chmod +x gradlew
    ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ~/frostkeys/app/build/outputs/apk/debug/*.apk
